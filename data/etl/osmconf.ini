#
# data/etl/osmconf.ini — GDAL OSM driver configuration for stage `osm` of data/etl/load.sh (Tier 2, Lisbon study area)
# What: GDAL's default osmconf.ini (GDAL 3.13) with the keys the site-selection layers read exposed as fields: roads and
#       rail (highway, railway, ref, maxspeed, oneway, service, bridge, tunnel), power (power, voltage, operator,
#       substation), schools and health (amenity, healthcare), stations (public_transport). Closed ways tagged
#       power=substation / power=plant are read as polygons (GDAL's default would report them as closed lines).
#       No other_tags / z_order: the loader keeps named columns only (smaller tables, no hstore parsing).
# Depends on: GDAL ≥ 3.10 (the [general] section). Used by: load.sh stage `osm` (OSM_CONFIG_FILE).
# When changing: a key removed here becomes a missing column in the stage's SELECT → the stage fails loudly.
[general]
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform,power=substation,power=plant,healthcare

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,ref,amenity,healthcare,power,voltage,operator,substation,railway,public_transport
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,ref,highway,railway,service,usage,maxspeed,oneway,bridge,tunnel,power,voltage,operator
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,ref,amenity,healthcare,power,voltage,operator,substation,railway,public_transport
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
other_tags=no
